# Sobrescritas locais, fora do Git.
spring.config.import=optional:classpath:application-local.properties

spring.application.name=gameplannerserver
server.port=${SERVER_PORT:8080}

# Excecoes do proprio Spring MVC (parte ausente, metodo nao suportado...) tambem
# saem como ProblemDetail, no mesmo formato dos erros da aplicacao.
spring.mvc.problemdetails.enabled=true

# ==========================================
# Banco
# ==========================================
# Sem valor padrao de credencial: em producao vem do ambiente (docker-compose.prod.yml),
# em desenvolvimento vem de application-local.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gameplanner}
spring.datasource.username=${DB_USERNAME:gameplanner}
spring.datasource.password=${DB_PASSWORD:gameplanner}

# Em desenvolvimento, rodar a aplicacao (IntelliJ ou spring-boot:run) sobe o
# docker-compose.yml sozinho e injeta a conexao a partir do container.
# start-only: o banco continua de pe quando a aplicacao para, entao o proximo
# Run nao espera o Postgres inicializar de novo.
# O arquivo e procurado no diretorio de trabalho: rode com working dir = backend/.
spring.docker.compose.lifecycle-management=start-only

# ==========================================
# JPA / Hibernate
# ==========================================
# validate, nunca update: quem altera schema e o Flyway. Com 'update' o Hibernate
# mexeria no banco por fora das migrations e as duas fontes divergiriam.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# Seguranca
# ==========================================
# Segredo HMAC do JWT. Minimo de 32 bytes. Obrigatorio no perfil prod.
gameplanner.jwt.secret=${JWT_SECRET:dev-secret-trocar-em-producao-com-32-bytes-no-minimo}
gameplanner.jwt.issuer=gameplanner
gameplanner.jwt.access-token-ttl=PT30M
gameplanner.jwt.refresh-token-ttl=P30D

gameplanner.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Limite de escritas por usuario autenticado, por minuto. 0 desliga.
# platform_admin nao tem limite (importador e minerador enviam milhares de imagens).
gameplanner.rate-limit.writes-per-minute=${RATE_LIMIT_WRITES_PER_MINUTE:60}

# ==========================================
# Midia (ver doc/backend_plan.md 4.7)
# ==========================================
gameplanner.media.storage-path=${MEDIA_STORAGE_PATH:./var/media}
# Limite em megapixels, e nao so em bytes: um PNG de 200 KB pode declarar
# 50000x50000 e estourar a memoria na decodificacao.
gameplanner.media.max-megapixels=40
gameplanner.media.max-frames=300
gameplanner.media.ffmpeg-timeout=PT20S
gameplanner.media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
gameplanner.media.ffprobe-path=${FFPROBE_PATH:ffprobe}
gameplanner.media.webp-quality=85
gameplanner.media.icon-size=128
gameplanner.media.thumb-size=512
gameplanner.media.full-size=1920
gameplanner.media.max-bytes=8MB
# Upload com ?large=true (imagem de mapa): gera tambem a variante "large". Sem animacao.
gameplanner.media.large.size=8192
gameplanner.media.large.max-bytes=40MB
gameplanner.media.large.max-megapixels=70
gameplanner.media.large.ffmpeg-timeout=PT120S
# O multipart barra antes de ler o corpo, no maior dos limites; o de cada modo e conferido no servico.
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
