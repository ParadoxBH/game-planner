<div style="
    width: {{SIZE}}px; 
    height: {{SIZE}}px; 
    border-radius: 50%; 
    {{BACKGROUND_STYLE}}
    display: flex; 
    align-items: center; 
    justify-content: center; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transition: transform 0.2s ease;
    {{BORDER_STYLE}}
" class="{{CLASS_NAME}}">
    <div style="
        width: calc(100% - {{BORDER_WIDTH}}px);
        height: calc(100% - {{BORDER_WIDTH}}px);
        border-radius: 50%;
        background: {{INNER_COLOR}};
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    ">
        <img src="{{ICON_URL}}" style="
            width: 85%; 
            height: 85%; 
            object-fit: contain;
            {{IMAGE_STYLE}}
        " />
    </div>
</div>
